<!doctype html>
<html lang="ro">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Login & Registration Form</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="icon" href="user.png" />
</head>
<body>
  <main class="wrap">
    <h1 class="title">Formular de autentificare și înregistrare</h1>

    <div class="card">
      <div class="tab-switch">
        <button id="show-login" class="tab active">Autentificare</button>
        <button id="show-register" class="tab">Înregistrare</button>
      </div>
      <section id="login-section" class="form-section">
        <form id="login-form" novalidate>
          <div class="field">
            <label for="login-email">Email</label>
            <input id="login-email" name="email" type="email" required />
          </div>

          <div class="field">
            <label for="login-password">Parolă</label>
            <input id="login-password" name="password" type="password" required minlength="6" />
          </div>

          <div class="actions">
            <button type="submit" class="btn">Autentificare</button>
          </div>

          <p class="message" id="login-message" aria-live="polite"></p>
        </form>
      </section>

      <section id="register-section" class="form-section hidden">
        <form id="register-form" novalidate>
          <div class="field">
            <label for="reg-name">Nume</label>
            <input id="reg-name" name="name" type="text" required />
          </div>

          <div class="field">
            <label for="reg-email">Email</label>
            <input id="reg-email" name="email" type="email" required />
          </div>

          <div class="field">
            <label for="reg-password">Parolă</label>
            <input id="reg-password" name="password" type="password" required minlength="6" />
          </div>

          <div class="field">
            <label for="reg-password2">Confirmare parolă</label>
            <input id="reg-password2" name="password2" type="password" required minlength="6" />
          </div>

          <div class="actions">
            <button type="submit" class="btn">Înregistrează-te</button>
          </div>

          <p class="message" id="register-message" aria-live="polite"></p>
        </form>
      </section>

    </div>

    <footer class="footer">Proiect demonstrativ — autentificare locală (client-side only)</footer>
  </main>

  <script src="js/main.js"></script>
</body>
</html>
